<svg
xmlns="http://www.w3.org/2000/svg"
width="586"
height="485"
viewBox="0 0 586 485">

<defs>

<style>

.terminal {
    fill: #0d1117;
}

.frame {
    fill: none;
    stroke: #30363d;
    stroke-width: 1;
}

.ascii {
    font-family:
        "Courier New",
        "Liberation Mono",
        monospace;

    font-size: 9px;

    font-weight: 700;

    fill: #58a6ff;

    opacity: 0;

    animation:
        typeLine
        0.5s
        ease-out
        forwards;
}

@keyframes typeLine {

    0% {
        opacity: 0;
        transform:
            translateX(-12px);
    }

    100% {
        opacity: 1;
        transform:
            translateX(0);
    }

}

</style>

</defs>

<rect
    class="terminal"
    x="0"
    y="0"
    width="100%"
    height="100%"
    rx="14"
/>

<rect
