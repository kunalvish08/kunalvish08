name: Update GitHub Profile Art

on:
  schedule:
    - cron: "17 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch contribution data
        run: |
          python scripts/fetch_contributions.py

      - name: Render contribution heatmap
        run: |
          python scripts/render_heatmap_svg.py

      - name: Generate contribution snake
        run: |
          python scripts/make_snake_svg.py

      - name: Commit updated profile art
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update GitHub contribution art"
          file_pattern: |
            data/contributions.json
            contrib-heatmap.svg
            snake.svg